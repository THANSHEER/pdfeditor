<app-tool-page title="Merge PDF" description="Combine multiple PDFs into one unified document instantly." icon="layers"
  acceptedTypes=".pdf" [allowMultiple]="true"
  actionLabel="Merge PDFs" actionIcon="layers" [isProcessing]="isProcessing" [errorMessage]="errorMessage"
  [selectedFiles]="files" [downloadFiles]="downloads" (filesChanged)="onFilesChanged($event)" (process)="onProcess()">
  <div slot="settings"
    class="space-y-3 p-5 bg-surface rounded-xl border border-main">
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-muted uppercase tracking-wider">Output File Name (Optional)</label>
      <input type="text" [(ngModel)]="customFileName" placeholder="merged-document.pdf"
        class="px-3.5 py-2 border border-main rounded-lg bg-card text-main font-sans text-sm focus-ring max-w-sm" />
    </div>
    <p class="text-xs text-muted font-normal">
      Ensure files are in the order you want them merged. Use the ▲ and ▼ buttons on the files above to reorder them before merging.
    </p>
  </div>
</app-tool-page>
