<app-tool-page
  title="Image to PDF"
  description="Convert JPG, PNG, WEBP and other images to PDF. Reorder images with the ▲▼ buttons."
  icon="image"
  acceptedTypes=".jpg,.jpeg,.png,.webp,.bmp,.gif"
  [allowMultiple]="true"
  uploadHint="JPG, PNG, WEBP, BMP, GIF files supported"
  actionLabel="Convert to PDF"
  actionIcon="settings"
  [isProcessing]="isProcessing"
  [errorMessage]="errorMessage"
  [selectedFiles]="files"
  [downloadFiles]="downloads"
  (filesChanged)="onFilesChanged($event)"
  (process)="onProcess()"
>
  <div slot="settings" class="flex flex-col gap-4">
    <div class="flex flex-wrap gap-4">
      <div class="flex flex-col gap-1.5 flex-1 min-w-[140px]">
        <label class="text-xs font-semibold text-muted uppercase tracking-wider">Page Size</label>
        <select
          class="px-3 py-2 border border-main rounded-lg bg-card text-main font-sans text-sm themed-select focus-ring cursor-pointer"
          [(ngModel)]="pageSize"
        >
          <option value="fit">Fit to Image</option>
          <option value="A4">A4</option>
          <option value="Letter">US Letter</option>
        </select>
      </div>
      <div class="flex flex-col gap-1.5 flex-1 min-w-[140px]">
        <label class="text-xs font-semibold text-muted uppercase tracking-wider">Margin (px)</label>
        <input
          type="number"
          class="px-3 py-2 border border-main rounded-lg bg-card text-main font-sans text-sm themed-input focus-ring max-w-[100px]"
          [(ngModel)]="margin"
          min="0"
          max="100"
        />
      </div>
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-muted uppercase tracking-wider">Output File Name (Optional)</label>
      <input
        type="text"
        [(ngModel)]="customFileName"
        placeholder="images.pdf"
        class="px-3.5 py-2 border border-main rounded-lg bg-card text-main font-sans text-sm themed-input focus-ring max-w-md"
      />
    </div>
  </div>
</app-tool-page>
