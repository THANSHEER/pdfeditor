<app-tool-page
  title="Protect PDF"
  description="Encrypt your PDF with a password to keep sensitive data confidential."
  icon="lock"
  iconBg="rgba(239, 68, 68, 0.1)"
  iconColor="#ef4444"
  [allowMultiple]="false"
  actionLabel="Protect PDF"
  actionIcon="lock"
  [isProcessing]="isProcessing"
  [errorMessage]="errorMessage"
  [selectedFiles]="files"
  [downloadFiles]="downloads"
  (filesChanged)="onFilesChanged($event)"
  (process)="onProcess()"
>
  <div slot="settings" class="flex flex-col gap-6">
    <!-- Password Input -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-slate-900 dark:text-white"
        >Set Password</label
      >
      <div class="relative">
        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Enter password..."
          class="w-full px-4 py-3 pr-12 border border-slate-200 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-sans text-base focus:outline-none focus:border-red-500 dark:focus:border-red-400 transition-colors"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          @if (showPassword) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-4.803m5.596-3.856a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          }
        </button>
      </div>
      <p class="text-xs text-slate-500 mt-1">This password will be required to open the PDF.</p>
    </div>

    <!-- Confirm Password -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-slate-900 dark:text-white"
        >Confirm Password</label
      >
      <div class="relative">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          placeholder="Re-enter password..."
          class="w-full px-4 py-3 pr-12 border border-slate-200 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-sans text-base focus:outline-none focus:border-red-500 dark:focus:border-red-400 transition-colors"
        />
        <button
          type="button"
          (click)="toggleConfirmPasswordVisibility()"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors"
          [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'"
        >
          @if (showConfirmPassword) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-4.803m5.596-3.856a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          }
        </button>
      </div>
      <p class="text-xs text-slate-500 mt-1">Re-enter the same password to avoid locking the file with a typo.</p>
      @if (confirmPassword && password && password !== confirmPassword) {
        <p class="text-xs font-medium text-red-600 dark:text-red-400">Passwords do not match.</p>
      }
    </div>

    <!-- Output Filename -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-slate-900 dark:text-white"
        >Output File Name (Optional)</label
      >
      <input
        type="text"
        [(ngModel)]="customFileName"
        placeholder="protected-document.pdf"
        class="px-4 py-3 border border-slate-200 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-sans text-base focus:outline-none focus:border-red-500 dark:focus:border-red-400 transition-colors"
      />
    </div>
  </div>
</app-tool-page>
