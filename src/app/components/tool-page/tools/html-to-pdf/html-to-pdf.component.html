<div class="max-w-4xl mx-auto px-4 sm:px-6 py-8 pb-32">
  <!-- Header -->
  <a routerLink="/tools"
    class="inline-flex items-center gap-1.5 text-xs font-semibold text-muted hover:text-main mb-6 transition-colors focus-ring">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    All Tools
  </a>

  <div class="flex items-center gap-3.5 mb-6">
    <div class="p-2.5 rounded-lg bg-surface text-main border border-main">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
    </div>
    <div>
      <h1 class="text-2xl font-bold text-main tracking-tight">HTML to PDF</h1>
      <p class="text-sm text-muted">Convert your HTML code or snippets to a professional PDF document.</p>
    </div>
  </div>

  <!-- Main Editor -->
  <div
    class="bg-card border border-main rounded-xl overflow-hidden shadow-sm transition-colors duration-150">
    <div class="flex items-center justify-between px-4 py-3 border-b border-main bg-surface">
      <div class="flex items-center gap-2">
        <span class="text-xs font-semibold text-muted uppercase tracking-wider">HTML Editor</span>
      </div>
      <div class="flex items-center gap-3">
        <select [(ngModel)]="pageSize"
          class="bg-transparent border-none text-xs font-semibold text-main focus:ring-0 cursor-pointer">
          <option value="A4">A4 Size</option>
          <option value="Letter">Letter</option>
          <option value="Legal">Legal</option>
        </select>
        <div class="w-px h-3.5 bg-main opacity-20"></div>
        <select [(ngModel)]="orientation"
          class="bg-transparent border-none text-xs font-semibold text-main focus:ring-0 cursor-pointer">
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>
    </div>

    <div class="relative">
      <textarea [(ngModel)]="htmlContent" placeholder="<h1>Hello World</h1><p>Start typing your HTML here...</p>"
        class="w-full h-96 p-4 bg-transparent border-none focus:ring-0 font-mono text-sm text-main resize-none placeholder:text-muted/40"></textarea>
    </div>
  </div>

  <!-- Actions -->
  <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
    <button (click)="convertToPdf()"
      class="w-full sm:w-auto px-6 py-3 rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-semibold text-sm hover:opacity-90 transition-opacity flex items-center justify-center gap-2 focus-ring">
      <span>Convert & Print PDF</span>
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
      </svg>
    </button>

    <div
      class="flex items-start gap-2.5 p-3 rounded-lg bg-surface border border-main text-xs text-muted max-w-md">
      <svg class="w-4 h-4 mt-0.5 flex-shrink-0 text-main" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <p class="leading-relaxed">
        <strong>Tip:</strong> Supports standard HTML tags (e.g., <code>&lt;table&gt;</code>, <code>&lt;img&gt;</code>) and inline CSS.
      </p>
    </div>
  </div>

  <!-- Error Toast -->
  @if (errorMessage) {
  <div
    class="fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-lg bg-red-600 text-white shadow-lg flex items-center gap-2.5 animate-fade-up z-50">
    <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
    <span class="text-xs font-semibold">{{ errorMessage }}</span>
  </div>
  }
</div>
