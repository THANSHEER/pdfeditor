<app-tool-page
  title="Unlock PDF"
  description="Remove PDF password security, giving you the freedom to use your PDFs as you want."
  icon="unlock"
  iconBg="rgba(6, 182, 212, 0.1)"
  iconColor="#06b6d4"
  [allowMultiple]="false"
  actionLabel="Unlock PDF"
  actionIcon="unlock"
  [isProcessing]="isProcessing"
  [errorMessage]="errorMessage"
  [selectedFiles]="files"
  [downloadFiles]="downloads"
  (filesChanged)="onFilesChanged($event)"
  (process)="onProcess()"
>
  <div slot="settings" class="flex flex-col gap-6">
    <!-- Password Input -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-slate-900 dark:text-white"
        >Enter Current Password</label
      >
      <div class="relative">
        <input
          type="password"
          [(ngModel)]="password"
          placeholder="Enter password..."
          class="w-full px-4 py-3 border border-slate-200 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-sans text-base focus:outline-none focus:border-cyan-500 dark:focus:border-cyan-400 transition-colors"
        />
        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
          </svg>
        </div>
      </div>
      <p class="text-xs text-slate-500 mt-1">Provide the password currently protecting this file to remove it.</p>
    </div>

    <!-- Output Filename -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-slate-900 dark:text-white"
        >Output File Name (Optional)</label
      >
      <input
        type="text"
        [(ngModel)]="customFileName"
        placeholder="unlocked-document.pdf"
        class="px-4 py-3 border border-slate-200 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-sans text-base focus:outline-none focus:border-cyan-500 dark:focus:border-cyan-400 transition-colors"
      />
    </div>
  </div>
</app-tool-page>
