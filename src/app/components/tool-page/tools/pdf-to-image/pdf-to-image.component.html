<app-tool-page
  title="PDF to Image"
  description="Convert your PDF pages to high-quality JPG or PNG images. All processing is done locally in your browser."
  icon="image"
  acceptedTypes=".pdf"
  [allowMultiple]="false"
  uploadHint="One PDF file at a time"
  actionLabel="Convert PDF"
  actionIcon="image"
  [isProcessing]="isProcessing"
  [errorMessage]="errorMessage"
  [selectedFiles]="files"
  [downloadFiles]="downloads"
  (filesChanged)="onFilesChanged($event)"
  (process)="onProcess()"
>
  <div slot="settings" class="flex flex-col gap-4">
    <div class="flex flex-wrap gap-4">
      <div class="flex flex-col gap-1.5 flex-1 min-w-[140px]">
        <label class="text-xs font-semibold text-muted uppercase tracking-wider">Format</label>
        <select class="px-3 py-2 border border-main rounded-lg bg-card text-main font-sans text-sm themed-select focus-ring cursor-pointer" [(ngModel)]="format">
          <option value="jpeg">JPG</option>
          <option value="png">PNG</option>
        </select>
      </div>
      <div class="flex flex-col gap-1.5 flex-1 min-w-[140px]">
        <label class="text-xs font-semibold text-muted uppercase tracking-wider">Quality / Scale</label>
        <select class="px-3 py-2 border border-main rounded-lg bg-card text-main font-sans text-sm themed-select focus-ring cursor-pointer" [(ngModel)]="scale">
          <option value="1">Standard (1x)</option>
          <option value="2">High (2x)</option>
          <option value="3">Ultra (3x)</option>
        </select>
      </div>
    </div>
    <p class="text-xs text-muted font-normal">Each page of the PDF will be exported as a separate image file.</p>
  </div>
</app-tool-page>
