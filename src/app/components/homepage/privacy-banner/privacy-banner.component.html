<div class="w-full">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
    @for (pillar of pillars; track pillar) {
      <div class="pillar-card bg-card border border-main rounded-2xl p-5 sm:p-6 transition-colors duration-200">
        <div class="flex justify-between items-start mb-4">
          <div class="flex items-center justify-center w-11 h-11 rounded-xl" [ngClass]="pillar.iconBg">
            <svg
              [attr.class]="'w-5 h-5 ' + pillar.iconColor"
              [attr.viewBox]="getIconData(pillar.icon).viewBox"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              [innerHTML]="getIconData(pillar.icon).path | safeHtml"
            ></svg>
          </div>
          <span class="text-xs font-bold px-2.5 py-1 rounded-md" [ngClass]="pillar.accentBadge">
            {{ pillar.badge }}
          </span>
        </div>
        <h3 class="text-base font-bold text-main mb-2">{{ pillar.title }}</h3>
        <p class="text-sm text-muted leading-relaxed">{{ pillar.description }}</p>
      </div>
    }
  </div>
</div>
