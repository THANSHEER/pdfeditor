<div class="w-full">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    @for (pillar of pillars; track pillar) {
      <div class="bg-card border border-main rounded-xl p-5 transition-colors duration-150 hover:border-zinc-400 dark:hover:border-zinc-600">
        <div class="flex justify-between items-start mb-4">
          <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-surface text-main border border-main">
            <svg
              class="w-4.5 h-4.5 text-main"
              [attr.viewBox]="getIconData(pillar.icon).viewBox"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              [innerHTML]="getIconData(pillar.icon).path | safeHtml"
            ></svg>
          </div>
          <span class="text-[11px] font-semibold tracking-wider uppercase px-2 py-0.5 rounded-md bg-surface text-muted border border-main">
            {{ pillar.badge }}
          </span>
        </div>
        <h3 class="text-base font-bold text-main mb-1.5">{{ pillar.title }}</h3>
        <p class="text-xs text-muted leading-relaxed font-normal">{{ pillar.description }}</p>
      </div>
    }
  </div>
</div>
