<section
  class="relative pt-10 pb-8 sm:pt-12 sm:pb-10 md:pt-16 md:pb-14 px-4 sm:px-6 text-center bg-main transition-colors duration-300 min-h-[55vh] flex items-center justify-center">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight leading-tight mb-6 text-main">
      All-in-one PDF tools.
      <span class="inline-grid grid-cols-1 justify-items-center mt-2">
        <span class="col-start-1 row-start-1 invisible pointer-events-none h-0">Free & Open Source.</span>
        <span class="col-start-1 row-start-1 text-primary min-h-[1.3em]">
          {{ displayText }}<span class="text-primary ml-0.5 opacity-70">|</span>
        </span>
      </span>
    </h1>

    <p class="text-base sm:text-lg text-muted font-medium leading-relaxed mb-8">
      <span class="block">Merge, split, compress, and edit your PDFs directly in your browser.</span>
      <span class="block mt-3 text-sm text-muted">Your files never leave your device.</span>
    </p>

    <div class="flex justify-center">
      <a routerLink="/tools"
        class="inline-flex items-center gap-2.5 px-7 py-3.5 rounded-xl bg-indigo-600 text-white font-bold text-base hover:bg-indigo-700 transition-colors duration-200">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.531 12.469 6.619 20.38a1 1 0 1 1-3-3l7.912-7.912" />
          <path d="M15.686 4.314A12.5 12.5 0 0 0 5.461 2.958 1 1 0 0 0 5.58 4.71a22 22 0 0 1 6.318 3.393" />
          <path
            d="M17.7 3.7a1 1 0 0 0-1.4 0l-4.6 4.6a1 1 0 0 0 0 1.4l2.6 2.6a1 1 0 0 0 1.4 0l4.6-4.6a1 1 0 0 0 0-1.4z" />
          <path d="M19.686 8.314a12.501 12.501 0 0 1 1.356 10.225 1 1 0 0 1-1.751-.119 22 22 0 0 0-3.394-6.319" />
        </svg>
        Explore all tools
      </a>
    </div>
  </div>
</section>
