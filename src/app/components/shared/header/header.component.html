<header
  class="site-header sticky top-0 z-50 border-b border-main bg-main/80 backdrop-blur-md transition-colors duration-200"
>
  <div
    class="w-full max-w-7xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center"
  >
    <!-- Logo -->
    <a
      routerLink="/"
      class="flex items-center gap-3 no-underline group"
    >
      <div class="p-2 rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 transition-opacity group-hover:opacity-90 flex items-center justify-center">
        <!-- PDF Toolkit logomark -->
        <svg
          class="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 3h10l6 6v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
          <path d="M14 3v6h6" />
          <path d="M7 17 L9 19 L17 11 L15 9 Z" fill="currentColor" fill-opacity="0.2" />
        </svg>
      </div>
      <div class="flex flex-col leading-none">
        <span class="font-bold text-base tracking-tight text-main">PDF Toolkit</span>
        <span class="text-[10px] font-medium tracking-wider uppercase text-muted">100% Client-Side</span>
      </div>
    </a>

    <!-- Navigation -->
    <nav class="flex items-center gap-3">
      <!-- All Tools link -->
      <a
        routerLink="/tools"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-muted hover:text-main hover:bg-surface transition-colors duration-150 uppercase tracking-wider"
      >
        All Tools
      </a>

      <!-- Theme Toggle -->
      <button
        (click)="toggleTheme()"
        [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
        class="p-2 rounded-lg bg-surface border border-main text-muted hover:text-main hover:border-zinc-400 dark:hover:border-zinc-600 transition-colors duration-150 flex items-center justify-center focus-ring"
      >
        @if (isDark) {
          <svg
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        }
        @if (!isDark) {
          <svg
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
            ></path>
          </svg>
        }
      </button>

      <!-- GitHub -->
      <a
        href="https://github.com/THANSHEER/pdfeditor"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Star on GitHub"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-semibold text-xs hover:opacity-90 transition-opacity duration-150 focus-ring"
      >
        <svg
          class="w-3.5 h-3.5 text-amber-400 fill-amber-400"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1"
        >
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
        </svg>
        <span>Star on GitHub</span>
      </a>
    </nav>
  </div>
</header>
