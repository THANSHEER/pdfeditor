<div class="min-h-screen pb-16 sm:pb-20 transition-colors duration-500" style="background-color: var(--bg-main);">

  <!-- Page heading -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-8 sm:pt-12 pb-6 sm:pb-8 text-center animate-fade-up">
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-black -tracking-wider mb-3" style="color: var(--text-main);">
      All PDF Tools
    </h1>
    <p class="text-base sm:text-lg font-medium max-w-xl mx-auto" style="color: var(--text-muted);">
      The complete toolkit for all your PDF requirements.
    </p>
  </div>

  <!-- Search -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 mb-2 relative z-10">
    <app-search-bar (search)="onSearch($event)"></app-search-bar>
  </div>

  <!-- Sticky category nav -->
  <app-category-nav
    [selectedCategoryId]="selectedCategoryId"
    (selectCategory)="onSelectCategory($event)"
  ></app-category-nav>

  <!-- Category sections — no outer padding; each section handles its own -->
  <div class="flex flex-col">
    @for (category of displayedCategories; track category.id) {
      <app-category-section
        [category]="category"
        [tools]="getFilteredToolsForCategory(category.id)"
      ></app-category-section>
    }

    <!-- No results -->
    @if (filteredTools.length === 0) {
      <div class="text-center py-16 sm:py-20 px-4 animate-fade-up">
        <div
          class="inline-flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-full mb-5"
          style="background-color: var(--bg-surface);"
        >
          <svg class="w-8 h-8 sm:w-10 sm:h-10" style="color: var(--text-muted);" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <p class="text-lg sm:text-xl font-bold mb-4" style="color: var(--text-muted);">
          No tools found matching your search.
        </p>
        <button
          (click)="resetFilters()"
          class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline transition-colors"
        >
          Clear filters and search
        </button>
      </div>
    }
  </div>

</div>
