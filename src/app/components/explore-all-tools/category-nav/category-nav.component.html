<div
  class="relative w-full border-b sticky top-16 z-30 mb-6"
  style="background-color: var(--glass-bg); border-color: var(--border-main); backdrop-filter: blur(12px);"
>
  <!-- Scroll-fade edges — visible only when content overflows (mobile/tablet) -->
  <div class="pointer-events-none absolute left-0 top-0 bottom-0 w-10 z-10 hidden sm:block"
    style="background: linear-gradient(to right, var(--glass-bg), transparent);"></div>
  <div class="pointer-events-none absolute right-0 top-0 bottom-0 w-10 z-10 hidden sm:block"
    style="background: linear-gradient(to left, var(--glass-bg), transparent);"></div>

  <div
    #scrollContainer
    class="flex items-center gap-2 overflow-x-auto no-scrollbar py-3 px-4 sm:px-8 lg:px-6 lg:justify-center"
  >
    @for (cat of categories; track cat.id) {
      <button
        (click)="onSelectCategory(cat.id)"
        [attr.data-active]="selectedCategoryId === cat.id"
        class="flex items-center gap-1.5 px-3.5 py-2 rounded-full whitespace-nowrap transition-all duration-250 font-bold text-sm border-2 flex-shrink-0"
        [ngClass]="selectedCategoryId === cat.id
          ? 'bg-gradient-to-r from-indigo-600 to-violet-600 border-indigo-600 text-white shadow-md shadow-indigo-500/20 scale-105'
          : 'hover:border-indigo-400 hover:text-indigo-600 dark:hover:border-indigo-500 dark:hover:text-indigo-400'"
        [style]="selectedCategoryId !== cat.id
          ? 'background-color: var(--bg-card); border-color: var(--border-main); color: var(--text-muted);'
          : ''"
      >
        <svg
          class="w-3.5 h-3.5 flex-shrink-0"
          [attr.viewBox]="getIconData(getIcon(cat.icon)).viewBox"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          [innerHTML]="getIconData(getIcon(cat.icon)).path | safeHtml"
        ></svg>
        {{ cat.name }}
      </button>
    }
  </div>
</div>
