name: Bug Report
description: File a bug report to help us improve PDF Toolkit
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I try to compress a PDF with the Aggressive preset, the page freezes…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior.
      value: |
        1. Go to '…'
        2. Click on '…'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which tool is affected?
      options:
        - Merge PDF
        - Split PDF
        - Compress PDF
        - Flatten PDF
        - Protect PDF
        - Unlock PDF
        - Image to PDF
        - PDF to Image
        - HTML to PDF
        - Rotate PDF
        - Remove Pages
        - Extract Pages
        - Organize PDF
        - Other / General
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & version
      placeholder: e.g. Chrome 124, Firefox 126, Safari 17
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 14, Windows 11, Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open DevTools (F12) → Console tab and paste any red error messages here.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, file types, file sizes, or anything else that might help.
